<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TripMind helps you plan, budget and keep track of your trips." />
    <meta name="color-scheme" content="light dark" />
    <title>TripMind</title>
    <script>
      // Apply the saved theme (dark forest-green by default) before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('tripmind-theme-v2')
        var known = ['dark', 'light', 'ocean', 'dusk', 'twilight', 'sand']
        document.documentElement.dataset.theme = known.indexOf(saved) !== -1 ? saved : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
