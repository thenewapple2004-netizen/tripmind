services:
  postgres:
    image: postgres:16-alpine
    container_name: tripmind-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tripmind_trips}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tripmind_trips}"]
      interval: 5s
      timeout: 5s
      retries: 5

  trip-service:
    build: ./services/trip-service
    container_name: tripmind-trip-service
    restart: always
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tripmind_trips}
    volumes:
      - ./services/trip-service/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: