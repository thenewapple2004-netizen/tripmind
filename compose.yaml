services:
  postgres:
    image: postgres:16-alpine
    container_name: tripmind-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tripmind_trips}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tripmind_trips}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    container_name: tripmind-auth-service
    restart: always
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/tripmind_auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-tripmind-super-secret-jwt-key-change-in-production-2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      SERVICE_NAME: auth-service
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - ./services/auth-service/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: tripmind-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  trip-service:
    build: ./services/trip-service
    container_name: tripmind-trip-service
    restart: always
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tripmind_trips}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      REPORTS_DIR: ${REPORTS_DIR:-/app/reports}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-tripmind-super-secret-jwt-key-change-in-production-2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      SERVICE_NAME: trip-service
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - ./services/trip-service/app:/app/app
      - ./services/trip-service/alembic:/app/alembic
      - ./services/trip-service/reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  celery-worker:
    build: ./services/trip-service
    container_name: tripmind-celery-worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tripmind_trips}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      REPORTS_DIR: ${REPORTS_DIR:-/app/reports}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-tripmind-super-secret-jwt-key-change-in-production-2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      SERVICE_NAME: celery-worker
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - ./services/trip-service/app:/app/app
      - ./services/trip-service/reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: tripmind-jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: tripmind-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - auth-service
      - trip-service

  grafana:
    image: grafana/grafana:10.4.0
    container_name: tripmind-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger

  client:
    build: ./client
    container_name: tripmind-client
    restart: always
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://trip-service:8000
      AUTH_PROXY_TARGET: http://auth-service:8000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - trip-service
      - auth-service

volumes:
  postgres_data:
  redis_data:
  grafana_data: