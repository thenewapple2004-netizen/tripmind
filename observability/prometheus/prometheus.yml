global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "auth-service"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["auth-service:8000"]
        labels:
          service: "auth-service"

  - job_name: "trip-service"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["trip-service:8000"]
        labels:
          service: "trip-service"
